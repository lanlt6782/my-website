<body>
    <h1>CSSによるフレーズ境界</h1>

        <span style="display: block">ブロック表示のテキスト</span>
        <span>インライン表示のテキスト</span>
    </p>

        <span style="display: inline">インラインテキスト1</span>
        <span style="display: inline">インラインテキスト2</span>
    </p>
