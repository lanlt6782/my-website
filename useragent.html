<!DOCTYPE html>
<html lang="vi">
<head>
      <script src="https://dev-d.sc-shutto-translation.com/trans.js?id=1448"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin User Agent</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 650px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #1a202c;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .info-box {
            background-color: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.95rem;
            word-break: break-all;
            color: #2d3748;
            border-left: 4px solid #3182ce;
        }
        .copy-btn {
            margin-top: 15px;
            padding: 10px 18px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .copy-btn:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>User Agent Của Bạn</h1>
        <div class="info-box" id="user-agent-display">
            Đang tải dữ liệu...
        </div>
        <button class="copy-btn" onclick="copyUserAgent()">Sao chép User Agent</button>
    </div>

    <script>
        // Lấy User Agent từ trình duyệt
        const ua = navigator.userAgent;

        // Hiển thị ra màn hình
        document.getElementById('user-agent-display').innerText = ua;

        // Hàm sao chép vào bộ nhớ tạm (Clipboard)
        function copyUserAgent() {
            navigator.clipboard.writeText(ua).then(() => {
                alert('Đã sao chép User Agent vào clipboard!');
            }).catch(err => {
                console.error('Lỗi khi sao chép: ', err);
            });
        }
    </script>

</body>
</html>
