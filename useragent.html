<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Dynamic DOM Test Page</title>
  <!-- External CSS mẫu -->
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header>
    <h1>お知らせ一覧</h1>
    <p id="static-intro">こちらは初期表示のテキストです。</p>
  </header>

  <main>
    <!-- Vùng trống ban đầu, script sẽ tạo/cập nhật DOM động vào đây -->
    <div id="dynamic-box"></div>

    <!-- Nút test thêm cập nhật DOM khi click -->
    <button id="btn-add-item" type="button">項目を追加</button>
  </main>

  <!-- External JS mẫu (nếu có) -->
  <script src="/assets/widget.js"></script>

  <!-- Script tạo/cập nhật DOM động -->
  <script>
    (function () {
      function renderDynamicContent() {
        const box = document.getElementById("dynamic-box");
        if (!box) return;

        // 1. Tạo node mới bên trong #dynamic-box
        const notice = document.createElement("div");
        notice.className = "dynamic-notice";
        notice.id = "dynamic-notice-1";

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "新着情報";

        const desc = document.createElement("p");
        desc.className = "desc";
        desc.textContent = "動的スクリプトによって追加された案内メッセージです。";

        notice.appendChild(badge);
        notice.appendChild(desc);

        box.innerHTML = "";
        box.appendChild(notice);
      }

      document.addEventListener("DOMContentLoaded", function () {
        renderDynamicContent();

        const btn = document.getElementById("btn-add-item");
        let count = 1;
        if (btn) {
          btn.addEventListener("click", function () {
            const box = document.getElementById("dynamic-box");
            if (!box) return;
            count += 1;
            const extra = document.createElement("p");
            extra.className = "extra-item";
            extra.textContent = "追加項目 #" + count + "：クリックで更新されたDOM";
            box.appendChild(extra);
          });
        }
      });
    })();
  </script>
</body>
</html>
