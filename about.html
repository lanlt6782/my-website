<!DOCTYPE html>
<html lang="vi">
<head>
    <script src="https://dev-d.sc-shutto-translation.com/trans.js?id=1448"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Số điện thoại</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .contact-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .phone-button {
            display: inline-block;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #28a745;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .phone-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <h2>Thông Tin Liên Hệ</h2>
        <p>Bấm vào nút bên dưới để gọi ngay:</p>
        
        <!-- Thay 0901234567 bằng số điện thoại của bạn -->
        <a href="tel:0901234567" class="phone-button">
            📞 090 123 4567
        </a>
    </div>

</body>
</html>
