<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウェブサイトへようこそ</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", MeiRyo, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            margin-top: 0;
        }
        .btn {
            display: inline-block;
            background: #e74c3c;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }
        .btn:hover {
            background: #c0392b;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>公式ウェブサイト</h1>
        <p>ご訪問ありがとうございます</p>
    </header>

    <main>
        <h2>はじめに</h2>
        <p>これは日本語で書かれたシンプルなHTMLテンプレートです。フォント設定や文字コード（UTF-8）が最適化されているため、日本語が綺麗に表示されます。</p>

        <h2>サービス内容</h2>
        <ul>
            <li>ウェブサイト制作・ an 開発</li>
            <li>日本語コンテンツの翻訳・作成</li>
            <li>デザインおよびコンサルティング</li>
        </ul>

        <h2>お問い合わせ</h2>
        <p>ご質問やご相談がございましたら、お気軽にご連絡ください。</p>
        
        <a href="#" class="btn">お問い合わせはこちら</a>
    </main>

    <footer>
        <p>&copy; 2026 私たちの会社. All Rights Reserved.</p>
    </footer>

</body>
</html>
