<!DOCTYPE html>
<html lang="ja">
<head>
    <script src="https://dev-d.sc-shutto-translation.com/trans.js?id=1440"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオ</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
        }
        p {
            line-height: 1.6;
            margin: 15px 0;
        }
        .profile-list {
            list-style: none;
            padding: 0;
        }
        .profile-list li {
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }
        .profile-list strong {
            color: #3498db;
        }
        .btn {
            display: block;
            margin-top: 20px;
            padding: 12px;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>初めまして！</h1>
        <p>私のウェブサイトへようこそ。ご覧いただきありがとうございます。</p>
        
        <ul class="profile-list">
            <li><strong>お名前：</strong> 山田 太郎</li>
            <li><strong>出身地：</strong> ベトナム</li>
            <li><strong>趣味：</strong> 読書、旅行、プログラミング</li>
            <li><strong>スキル：</strong> HTML, CSS, JavaScript, 日本語</li>
        </ul>

        <p>新しい技術を学ぶことや、世界中の人とコミュニケーションをとることが大好きです。よろしくお願いします！</p>
        
        <a href="mailto:example@email.com" class="btn">お問い合わせ</a>
    </div>

</body>
</html>
